services:
  dev:
    build: .
    platform: linux/arm64          # native on Apple Silicon
    working_dir: /workspace
    volumes:
      - .:/workspace
      - venv:/opt/venv             # Linux venv, kept out of the bind mount
      - uv-cache:/root/.cache/uv   # Wheel cache should survive container recreation
    environment:
      TRITON_INTERPRET: "1"
    stdin_open: true
    tty: true

volumes:
  venv:
  uv-cache:
